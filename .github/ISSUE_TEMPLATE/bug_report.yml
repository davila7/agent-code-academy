name: Bug report
description: Report a reproducible problem with the site.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Search for...
        3. Observe...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
  - type: textarea
    id: additional
    attributes:
      label: Additional context
